[build-system]
requires = ["scikit-build-core>=0.5", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "sdrmon"
version = "0.1.0"
description = "A terminal-first SDR monitoring and analysis toolkit for Python."
readme = "README.md"
authors = [
    { name = "letchupkt" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
rtlsdr = ["pyrtlsdr>=0.3.0"]
hackrf = ["libhackrf>=0.1"]
pluto = ["pyadi-iio>=0.0.15"]
tui = ["textual>=0.50.0", "rich>=13.0.0"]
audio = ["sounddevice>=0.4.6", "scipy>=1.10.0"]
all = ["pyrtlsdr>=0.3.0", "libhackrf>=0.1", "pyadi-iio>=0.0.15", "textual>=0.50.0", "rich>=13.0.0", "sounddevice>=0.4.6", "scipy>=1.10.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "ruff>=0.1", "pyright>=1.1"]

[project.scripts]
sdrmon = "sdrmon.cli.app:main"

[tool.scikit-build]
cmake.source-dir = "native"
wheel.packages = ["src/sdrmon"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
pythonpath = ["src"]
testpaths = [
    "tests",
]
markers = [
    "hardware: marks tests as requiring real SDR hardware to be connected (deselect with '-m \"not hardware\"')",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
